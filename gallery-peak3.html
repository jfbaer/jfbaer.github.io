body{background:#fff;margin:0;font-family:system-ui;--wide:70rem}

</style></head><body><h1>NEW peak-3 modules (107) — three cells stacked in one degree</h1><style>
.modgrid{
  /* thickness knobs — in UNIT space (1 = one degree step), so weight scales with
     each module: this keeps the geometric node-clearance intact at any display
     size, so thick lines never graze a node on a scaled-down module. */
  --sq-edge-w: 2.2;     /* line thickness (on-screen px, constant) */
  --sq-node-d: 6.5;     /* node dot size  (on-screen px, constant) */
  --cell: 160px;        /* uniform card size */
  /* operation palette — light theme (reuses the homepage --sq-* names) */
  --sq-ink:#000000; --sq-blue:#1e66f5; --sq-purple:#8839ef; --sq-orange:#fe640b;
  --sq-green:#40a02b; --sq-sky:#04a5e5; --sq-red:#d20f39;
  /* break out wider than the prose column; uniform grid */
  position:relative; left:50%; transform:translateX(-50%);
  width:min(94vw,var(--wide,74rem));
  display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));
  gap:.75rem; margin-block:var(--s5,2rem);
}
:root[data-theme='dark'] .modgrid{
  --sq-ink:#eceff4; --sq-blue:#81a1c1; --sq-purple:#b48ead; --sq-orange:#d08770;
  --sq-green:#a3be8c; --sq-sky:#88c0d0; --sq-red:#bf616a;
}
.modgrid .modcell{
  margin:0; padding:.5rem; aspect-ratio:1; position:relative; cursor:pointer;
  border:1px solid var(--rule,#dcdcdc); border-radius:7px; background:var(--paper,#fff);
  display:flex; align-items:center; justify-content:center;
  content-visibility:auto; contain-intrinsic-size:var(--cell);
  transition:border-color .15s ease;
}
.modgrid .modcell:hover{ border-color:var(--accent,#1e66f5); }
.modgrid .modcell.copied{ border-color:var(--accent,#1e66f5); }
.modgrid .modcell.copied::after{
  content:"copied"; position:absolute; left:50%; bottom:5px; transform:translateX(-50%);
  font-family:var(--font-mono,monospace); font-size:.58rem; letter-spacing:.06em;
  color:var(--accent,#1e66f5); background:var(--paper,#fff); padding:0 .25em; pointer-events:none;
}
/* overflow:visible so the constant-size (non-scaling) dots and stroke ends never
   clip against the viewBox on scaled-down modules — they sit in the cell padding. */
.modgrid svg.sq-shape{ display:block; width:100%; height:100%; overflow:visible;
  shape-rendering:geometricPrecision; }
.modgrid .sq-e{ fill:none; stroke:var(--c); stroke-width:var(--sq-edge-w);
  stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
.modgrid .sq-n{ fill:none; stroke:var(--c); stroke-width:var(--sq-node-d);
  stroke-linecap:round; vector-effect:non-scaling-stroke; }
.modgrid .sq-c-ink{--c:var(--sq-ink)} .modgrid .sq-c-blue{--c:var(--sq-blue)}
.modgrid .sq-c-purple{--c:var(--sq-purple)} .modgrid .sq-c-orange{--c:var(--sq-orange)}
.modgrid .sq-c-green{--c:var(--sq-green)} .modgrid .sq-c-sky{--c:var(--sq-sky)}
.modgrid .sq-c-red{--c:var(--sq-red)}
</style>
